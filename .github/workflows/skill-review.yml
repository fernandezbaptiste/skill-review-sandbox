name: Skill Review
on:
  pull_request:
    paths: ['**/SKILL.md']

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: tesslio/skill-review-and-optimize@717c37bdbb55fc186783d1589e10fbbf61a0db31
        with:
          optimize: true
          inline-suggestions: true
          re-review-on-suggestion-acceptance: false
          tessl-token: ${{ secrets.TESSL_API_TOKEN }}