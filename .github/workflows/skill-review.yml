name: Skill Review
on:
  pull_request:
    paths: ['**/SKILL.md']

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: tesslio/skill-review-and-optimize@ed1dbae31e43692562bb395bd0dacdc6cb8ec76a
        with:
          optimize: true
          inline-suggestions: true
          tessl-token: ${{ secrets.TESSL_API_TOKEN }}
