name: Skill Review
on:
  pull_request:
    paths: ['**/SKILL.md']

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: tesslio/skill-review-and-optimize@ec0f6a0784ac592e630b53d39242c2f7d22984a6
        with:
          optimize: true
          inline-suggestions: true
          tessl-token: ${{ secrets.TESSL_API_TOKEN }}
