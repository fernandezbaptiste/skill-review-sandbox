name: Skill Review
on:
  pull_request:
    paths: ['**/SKILL.md']

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: tesslio/skill-review-and-optimize@fe753dcb0b027aa7a2438b9dfc1f264f9aa863e1
        with:
          optimize: true
          inline-suggestions: true
          re-review-on-suggestion-acceptance: false
          tessl-token: ${{ secrets.TESSL_API_TOKEN }}